# Exported from the restored graspagent environment.
# Target: Linux x86_64 with an NVIDIA driver compatible with CUDA 12.8.
# Create: conda env create -f environment.yml
# Python is pinned to CPython to avoid replacing it with GraalPy.
name: graspagent
channels:
  - https://mirrors.tuna.tsinghua.edu.cn/anaconda/cloud/conda-forge
  - https://mirrors.tuna.tsinghua.edu.cn/anaconda/pkgs/r
  - https://mirrors.tuna.tsinghua.edu.cn/anaconda/pkgs/free
  - defaults
dependencies:
  - _openmp_mutex=4.5
  - bzip2=1.0.8
  - ca-certificates=2026.7.22
  - ld_impl_linux-64=2.46.1
  - libexpat=2.8.5
